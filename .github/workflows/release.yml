name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p upload
          cp target/release/rustclaw dist/
          tar -czf "upload/rustclaw-${{ matrix.target }}.tar.gz" -C dist rustclaw

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustclaw-${{ matrix.target }}
          path: upload/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: upload

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Merge checksums
        run: |
          shasum -a 256 upload/*.tar.gz > upload/checksums.txt
          cat upload/checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
