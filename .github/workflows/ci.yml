name: ci

on:
  push:
    branches: ["*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + clippy + fmt
    # macOS is the only supported platform (see release.yml), so the gate
    # runs where the product actually ships. Linux is best-effort below.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Test
        run: cargo test --all-targets --locked

      - name: Test (voice feature)
        run: cargo test --all-targets --locked --features voice

      - name: Evals (offline regression gate)
        run: cargo run --quiet --locked -- evals

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Format
        run: cargo fmt --check

  msrv:
    name: MSRV (1.90)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - name: Check (MSRV)
        run: cargo check --locked

  linux:
    name: linux (best-effort, not supported yet)
    # Linux is not an officially supported platform: this job only surfaces
    # breakage early. It must never block a merge, so failures are ignored.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `voice` is a default feature (cpal -> alsa-sys), so even a plain
      # `cargo check` needs the ALSA headers on Linux.
      - name: Install system deps (ALSA for the `voice` feature)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-linux-

      - name: Check
        run: cargo check --all-targets --locked

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
          arguments: --workspace
